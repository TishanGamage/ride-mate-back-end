# Verification Code Messages
verification.code-not-found = No verification code found for this email address.
verification.already-verified = This code has already been verified.
verification.code-expired = Verification code has expired. Please request a new code.
verification.max-attempts-exceeded = Maximum verification attempts exceeded. Please request a new code.
verification.invalid-code = Invalid verification code. Please try again.
verification.success = Verification code verified successfully.
