databaseChangeLog:
  - changeSet:
      id: 1
      author: Tishan
      changes:
        - createTable:
            tableName: user_identification_details
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_user_identification_user
                    references: user(id)
                    deleteCascade: true
              - column:
                  name: identification_type_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_user_identification_type
                    references: identification_type(id)
              - column:
                  name: identification_number
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: issue_date
                  type: DATE
                  constraints:
                    nullable: true
              - column:
                  name: expiry_date
                  type: DATE
                  constraints:
                    nullable: true
              - column:
                  name: issuing_country
                  type: VARCHAR(100)
                  constraints:
                    nullable: true
              - column:
                  name: issuing_authority
                  type: VARCHAR(255)
                  constraints:
                    nullable: true
              - column:
                  name: front_image_document_id
                  type: BIGINT
                  constraints:
                    nullable: true
                    foreignKeyName: fk_user_identification_front_document
                    references: document_details(id)
              - column:
                  name: back_image_document_id
                  type: BIGINT
                  constraints:
                    nullable: true
                    foreignKeyName: fk_user_identification_back_document
                    references: document_details(id)
              - column:
                  name: is_verified
                  type: VARCHAR(10)
                  constraints:
                    nullable: false
              - column:
                  name: verified_date
                  type: TIMESTAMP
                  constraints:
                    nullable: true
              - column:
                  name: verified_by
                  type: VARCHAR(100)
                  constraints:
                    nullable: true
              - column:
                  name: verification_notes
                  type: TEXT
                  constraints:
                    nullable: true
              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: created_date
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: created_user
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: modified_date
                  type: TIMESTAMP
                  constraints:
                    nullable: true
              - column:
                  name: modified_user
                  type: VARCHAR(100)
                  constraints:
                    nullable: true
              - column:
                  name: sync_ts
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false