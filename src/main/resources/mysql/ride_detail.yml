databaseChangeLog:
  - changeSet:
      id: 1
      author: Iruni
      changes:
        - createTable:
            tableName: driver_ride_detail
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: driver_profile_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_rider_details_driver_profile
                    references: driver_profile(id)
                    deleteCascade: true
              - column:
                  name: start_location_longitude
                  type: DECIMAL(10,7)
                  constraints:
                    nullable: false
              - column:
                  name: end_location_longitude
                  type: DECIMAL(10,7)
                  constraints:
                    nullable: false
              - column:
                  name: start_city
                  type: VARCHAR(100)
                  constraints:
                    nullable: true
              - column:
                  name: available_seats
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: start_time
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: total_ride_distance
                  type: DECIMAL(10,2)
                  constraints:
                    nullable: false
              - column:
                  name: trip_route
                  type: CLOB
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(100)
                  constraints:
                    nullable: true
              - column:
                  name: created_date
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: created_user
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: modified_date
                  type: TIMESTAMP
                  constraints:
                    nullable: true
              - column:
                  name: modified_user
                  type: VARCHAR(100)
                  constraints:
                    nullable: true
              - column:
                  name: sync_ts
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false

  - changeSet:
      id: 2
      author: Iruni
      changes:
        - addColumn:
            columns:
              - column:
                  name: start_location_latitude
                  type: decimal(10,7)
            tableName:  driver_ride_detail
        - addColumn:
            columns:
              - column:
                  name: end_location_latitude
                  type: decimal(10,7)
            tableName:  driver_ride_detail
  - changeSet:
      id: 3
      author: Iruni
      changes:
        - addColumn:
            columns:
              - column:
                  name: per_km_rate
                  type: decimal(10,7)
            tableName: driver_ride_detail
        - addColumn:
            columns:
              - column:
                  name: total_ride_cost
                  type: decimal(10,7)
            tableName: driver_ride_detail