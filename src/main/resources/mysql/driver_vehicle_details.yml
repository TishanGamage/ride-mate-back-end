databaseChangeLog:
  - changeSet:
      id: 1
      author: Tishan
      changes:
        - createTable:
            tableName: driver_vehicle_details
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: driver_profile_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_driver_vehicle_driver_profile
                    references: driver_profile(id)
                    deleteCascade: true
              - column:
                  name: vehicle_type_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_driver_vehicle_type
                    references: vehicle_type(id)
              - column:
                  name: vehicle_make_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_driver_vehicle_make
                    references: vehicle_make(id)
              - column:
                  name: registration_number
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: model
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: year
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: color
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: seats
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: vehicle_image_document_id
                  type: BIGINT
                  constraints:
                    nullable: true
                    foreignKeyName: fk_driver_vehicle_vehicle_image_document
                    references: document_details(id)
              - column:
                  name: registration_certificate_document_id
                  type: BIGINT
                  constraints:
                    nullable: true
                    foreignKeyName: fk_driver_vehicle_registration_document
                    references: document_details(id)
              - column:
                  name: insurance_number
                  type: VARCHAR(100)
                  constraints:
                    nullable: true
              - column:
                  name: insurance_provider
                  type: VARCHAR(100)
                  constraints:
                    nullable: true
              - column:
                  name: insurance_expiry
                  type: DATE
                  constraints:
                    nullable: true
              - column:
                  name: insurance_document_id
                  type: BIGINT
                  constraints:
                    nullable: true
                    foreignKeyName: fk_driver_vehicle_insurance_document
                    references: document_details(id)
              - column:
                  name: is_verified
                  type: VARCHAR(3)
                  constraints:
                    nullable: false
              - column:
                  name: verified_date
                  type: TIMESTAMP
                  constraints:
                    nullable: true
              - column:
                  name: verified_by
                  type: VARCHAR(100)
                  constraints:
                    nullable: true
              - column:
                  name: is_primary
                  type: VARCHAR(3)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: rejection_reason
                  type: TEXT
                  constraints:
                    nullable: true
              - column:
                  name: created_date
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: created_user
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: modified_date
                  type: TIMESTAMP
                  constraints:
                    nullable: true
              - column:
                  name: modified_user
                  type: VARCHAR(100)
                  constraints:
                    nullable: true
              - column:
                  name: sync_ts
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false

  - changeSet:
      id: 2
      author: Tishan
      comment: "Rename vehicle_image_document_id to vehicle_image_document_id_1; rename insurance_document_id to insurance_document_id_1; add vehicle_model_id, vehicle_image_document_id_2/3/4, insurance_document_id_2, revenue_license_document_id_1/2"
      changes:
        - renameColumn:
            tableName: driver_vehicle_details
            oldColumnName: vehicle_image_document_id
            newColumnName: vehicle_image_document_id_1
            columnDataType: BIGINT
        - renameColumn:
            tableName: driver_vehicle_details
            oldColumnName: insurance_document_id
            newColumnName: insurance_document_id_1
            columnDataType: BIGINT
        - addColumn:
            tableName: driver_vehicle_details
            columns:
              - column:
                  name: vehicle_model_id
                  type: BIGINT
                  constraints:
                    nullable: true
                    foreignKeyName: fk_driver_vehicle_model
                    references: vehicle_model(id)
              - column:
                  name: vehicle_image_document_id_2
                  type: BIGINT
                  constraints:
                    nullable: true
                    foreignKeyName: fk_driver_vehicle_vehicle_image_document_2
                    references: document_details(id)
              - column:
                  name: vehicle_image_document_id_3
                  type: BIGINT
                  constraints:
                    nullable: true
                    foreignKeyName: fk_driver_vehicle_vehicle_image_document_3
                    references: document_details(id)
              - column:
                  name: vehicle_image_document_id_4
                  type: BIGINT
                  constraints:
                    nullable: true
                    foreignKeyName: fk_driver_vehicle_vehicle_image_document_4
                    references: document_details(id)
              - column:
                  name: insurance_document_id_2
                  type: BIGINT
                  constraints:
                    nullable: true
                    foreignKeyName: fk_driver_vehicle_insurance_document_2
                    references: document_details(id)
              - column:
                  name: revenue_license_document_id_1
                  type: BIGINT
                  constraints:
                    nullable: true
                    foreignKeyName: fk_driver_vehicle_revenue_license_document_1
                    references: document_details(id)
              - column:
                  name: revenue_license_document_id_2
                  type: BIGINT
                  constraints:
                    nullable: true
                    foreignKeyName: fk_driver_vehicle_revenue_license_document_2
                    references: document_details(id)
