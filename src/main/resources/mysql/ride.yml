databaseChangeLog:
  - changeSet:
      id: 1
      author: TishanD
      changes:
        - createTable:
            tableName: ride
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    nullable: false
                    primaryKey: true
              - column:
                  name: passenger_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_ride_passenger
                    references: user(id)
              - column:
                  name: driver_id
                  type: bigint
                  constraints:
                    nullable: true
                    foreignKeyName: fk_ride_driver
                    references: user(id)
              - column:
                  name: vehicle_id
                  type: bigint
                  constraints:
                    nullable: true
                    foreignKeyName: fk_ride_vehicle
                    references: vehicle(id)
              - column:
                  name: pickup_location
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: dropoff_location
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: pickup_latitude
                  type: decimal(10,8)
                  constraints:
                    nullable: true
              - column:
                  name: pickup_longitude
                  type: decimal(11,8)
                  constraints:
                    nullable: true
              - column:
                  name: dropoff_latitude
                  type: decimal(10,8)
                  constraints:
                    nullable: true
              - column:
                  name: dropoff_longitude
                  type: decimal(11,8)
                  constraints:
                    nullable: true
              - column:
                  name: distance_km
                  type: decimal(10,2)
                  constraints:
                    nullable: true
              - column:
                  name: estimated_duration_minutes
                  type: int
                  constraints:
                    nullable: true
              - column:
                  name: ride_status
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: requested_time
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                  name: accepted_time
                  type: timestamp
                  constraints:
                    nullable: true
              - column:
                  name: pickup_time
                  type: timestamp
                  constraints:
                    nullable: true
              - column:
                  name: dropoff_time
                  type: timestamp
                  constraints:
                    nullable: true
              - column:
                  name: created_user
                  type: varchar(30)
                  constraints:
                    nullable: false
              - column:
                  name: created_date
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                  name: modified_user
                  type: varchar(30)
                  constraints:
                    nullable: true
              - column:
                  name: modified_date
                  type: timestamp
                  constraints:
                    nullable: true
              - column:
                  name: version
                  type: bigint
                  constraints:
                    nullable: false

