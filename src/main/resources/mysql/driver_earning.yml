databaseChangeLog:
  - changeSet:
      id: 1
      author: Danushka
      changes:
        - createTable:
            tableName: driver_earning
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: false
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: version
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: sync_ts
                  type: DATETIME
              - column:
                  name: driver_profile_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_driver_earning_profile
                    references: driver_profile(id)
              - column:
                  name: ride_detail_id
                  type: BIGINT
                  constraints:
                    foreignKeyName: fk_driver_earning_ride
                    references: driver_ride_detail(id)
              - column:
                  name: passenger_user_id
                  type: BIGINT
                  constraints:
                    foreignKeyName: fk_driver_earning_passenger
                    references: user(id)
              - column:
                  name: amount
                  type: DECIMAL(10,2)
                  constraints:
                    nullable: false
              - column:
                  name: currency
                  type: VARCHAR(10)
                  defaultValue: LKR
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: created_date
                  type: DATETIME
                  constraints:
                    nullable: false
              - column:
                  name: created_user
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: modified_date
                  type: DATETIME
              - column:
                  name: modified_user
                  type: VARCHAR(100)

