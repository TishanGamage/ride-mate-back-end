databaseChangeLog:
  - changeSet:
      id: 1
      author: Tishan
      changes:
        - createTable:
            tableName: driver_profile
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_profile_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    unique: true
                    foreignKeyName: fk_driver_profile_user_profile
                    references: user_profile(id)
                    deleteCascade: true
              - column:
                  name: driver_license_number
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: driver_license_expiry
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: driver_license_verified
                  type: VARCHAR(3)
                  defaultValue: "NO"
                  constraints:
                    nullable: false
              - column:
                  name: driver_license_front_url
                  type: VARCHAR(500)
                  constraints:
                    nullable: true
              - column:
                  name: driver_license_back_url
                  type: VARCHAR(500)
                  constraints:
                    nullable: true
              - column:
                  name: rating_as_driver
                  type: DECIMAL(3,2)
                  defaultValueNumeric: 0.0
                  constraints:
                    nullable: false
              - column:
                  name: total_rides_as_driver
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: total_earnings
                  type: DECIMAL(10,2)
                  defaultValueNumeric: 0.0
                  constraints:
                    nullable: false
              - column:
                  name: account_status
                  type: VARCHAR(20)
                  defaultValue: "PENDING_VERIFICATION"
                  constraints:
                    nullable: false
              - column:
                  name: background_check_status
                  type: VARCHAR(20)
                  defaultValue: "PENDING"
                  constraints:
                    nullable: true
              - column:
                  name: background_check_date
                  type: TIMESTAMP
                  constraints:
                    nullable: true
              - column:
                  name: approved_date
                  type: TIMESTAMP
                  constraints:
                    nullable: true
              - column:
                  name: created_date
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: created_user
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: modified_date
                  type: TIMESTAMP
                  constraints:
                    nullable: true
              - column:
                  name: modified_user
                  type: VARCHAR(100)
                  constraints:
                    nullable: true
              - column:
                  name: sync_ts
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false