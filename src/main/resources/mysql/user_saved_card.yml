databaseChangeLog:
  - changeSet:
      id: 1
      author: Danushka
      changes:
        - createTable:
            tableName: user_saved_card
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: false
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: version
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: sync_ts
                  type: DATETIME
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_saved_card_user
                    references: user(id)
              - column:
                  name: customer_token
                  type: VARCHAR(500)
                  constraints:
                    nullable: false
              - column:
                  name: card_holder_name
                  type: VARCHAR(200)
              - column:
                  name: card_no_masked
                  type: VARCHAR(20)
              - column:
                  name: card_expiry
                  type: VARCHAR(10)
              - column:
                  name: payment_method
                  type: VARCHAR(50)
              - column:
                  name: is_active
                  type: VARCHAR(3)
                  defaultValue: "YES"
                  constraints:
                    nullable: false
              - column:
                  name: created_date
                  type: DATETIME
                  constraints:
                    nullable: false
              - column:
                  name: created_user
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: modified_date
                  type: DATETIME
              - column:
                  name: modified_user
                  type: VARCHAR(100)

