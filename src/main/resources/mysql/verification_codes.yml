databaseChangeLog:
  - changeSet:
      author: Tishan
      changes:
        - createTable:
            tableName: verification_codes
            columns:
              - column:
                  name: id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: email
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: code
                  type: VARCHAR(6)
                  constraints:
                    nullable: false
              - column:
                  name: expiry_time
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: created_date
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: verified
                  type: VARCHAR(6)
                  constraints:
                    nullable: false
              - column:
                  name: attempt_count
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
        - createIndex:
            indexName: idx_verification_codes_email
            tableName: verification_codes
            columns:
              - column:
                  name: email
        - createIndex:
            indexName: idx_verification_codes_expiry_time
            tableName: verification_codes
            columns:
              - column:
                  name: expiry_time

