databaseChangeLog:
  - changeSet:
      id: 2
      author: Tishan
      changes:
        - addColumn:
            tableName: verification_codes
            columns:
              - column:
                  name: target_email
                  type: VARCHAR(255)
                  constraints:
                    nullable: true
  - changeSet:
      id: 1
      author: Tishan
      changes:
        - createTable:
            tableName: verification_codes
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: email
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: code
                  type: VARCHAR(6)
                  constraints:
                    nullable: false
              - column:
                  name: expiry_time
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: verified
                  type: VARCHAR(6)
                  constraints:
                    nullable: false
              - column:
                  name: attempt_count
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: created_date
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: created_user
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: modified_date
                  type: TIMESTAMP
                  constraints:
                    nullable: true
              - column:
                  name: modified_user
                  type: VARCHAR(100)
                  constraints:
                    nullable: true
              - column:
                  name: sync_ts
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: bigint
                  defaultValue: 0
                  constraints:
                    nullable: false
