databaseChangeLog:
  - changeSet:
      id: 1
      author: Danushka
      changes:
        - createTable:
            tableName: payment_transaction
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: false
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: version
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: sync_ts
                  type: DATETIME
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_payment_txn_user
                    references: user(id)
              - column:
                  name: ride_detail_id
                  type: BIGINT
                  constraints:
                    foreignKeyName: fk_payment_txn_ride
                    references: driver_ride_detail(id)
              - column:
                  name: order_id
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: payment_id
                  type: VARCHAR(100)
              - column:
                  name: payhere_amount
                  type: DECIMAL(10,2)
                  constraints:
                    nullable: false
              - column:
                  name: currency
                  type: VARCHAR(10)
                  defaultValue: LKR
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(30)
                  constraints:
                    nullable: false
              - column:
                  name: customer_token
                  type: VARCHAR(500)
              - column:
                  name: method
                  type: VARCHAR(50)
              - column:
                  name: created_date
                  type: DATETIME
                  constraints:
                    nullable: false
              - column:
                  name: created_user
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: modified_date
                  type: DATETIME
              - column:
                  name: modified_user
                  type: VARCHAR(100)

