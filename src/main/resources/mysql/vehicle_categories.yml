databaseChangeLog:
  - changeSet:
      id: 1
      author: TishanD
      changes:
        - createTable:
            tableName: vehicle_categories
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    nullable: false
                    primaryKey: true
              - column:
                  name: category_name
                  type: varchar(70)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: category_description
                  type: varchar(255)
                  constraints:
                    nullable: true
              - column:
                  name: capacity
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: base_fare
                  type: decimal(10,2)
                  constraints:
                    nullable: false
              - column:
                  name: per_km_rate
                  type: decimal(10,2)
                  constraints:
                    nullable: false
              - column:
                  name: category_status
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: created_user
                  type: varchar(30)
                  constraints:
                    nullable: false
              - column:
                  name: created_date
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                  name: modified_user
                  type: varchar(30)
                  constraints:
                    nullable: true
              - column:
                  name: modified_date
                  type: timestamp
                  constraints:
                    nullable: true
              - column:
                  name: version
                  type: bigint
                  constraints:
                    nullable: false

