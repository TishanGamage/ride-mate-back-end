databaseChangeLog:
  - changeSet:
      id: 1
      author: TishanD
      changes:
        - createTable:
            tableName: vehicle
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    nullable: false
                    primaryKey: true
              - column:
                  name: driver_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_vehicle_driver
                    references: user(id)
              - column:
                  name: category_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_vehicle_category
                    references: vehicle_categories(id)
              - column:
                  name: vehicle_number
                  type: varchar(50)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: vehicle_model
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: vehicle_make
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: vehicle_year
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: vehicle_color
                  type: varchar(50)
                  constraints:
                    nullable: true
              - column:
                  name: vehicle_status
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: created_user
                  type: varchar(30)
                  constraints:
                    nullable: false
              - column:
                  name: created_date
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                  name: modified_user
                  type: varchar(30)
                  constraints:
                    nullable: true
              - column:
                  name: modified_date
                  type: timestamp
                  constraints:
                    nullable: true
              - column:
                  name: version
                  type: bigint
                  constraints:
                    nullable: false

