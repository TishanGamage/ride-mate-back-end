databaseChangeLog:
  - changeSet:
      id: 1
      author: TishanD
      changes:
        - createTable:
            tableName: cost
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    nullable: false
                    primaryKey: true
              - column:
                  name: ride_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_cost_ride
                    references: ride(id)
              - column:
                  name: base_fare
                  type: decimal(10,2)
                  constraints:
                    nullable: false
              - column:
                  name: distance_fare
                  type: decimal(10,2)
                  constraints:
                    nullable: false
              - column:
                  name: time_fare
                  type: decimal(10,2)
                  constraints:
                    nullable: true
              - column:
                  name: surge_multiplier
                  type: decimal(5,2)
                  constraints:
                    nullable: true
              - column:
                  name: discount_amount
                  type: decimal(10,2)
                  constraints:
                    nullable: true
              - column:
                  name: tax_amount
                  type: decimal(10,2)
                  constraints:
                    nullable: true
              - column:
                  name: total_fare
                  type: decimal(10,2)
                  constraints:
                    nullable: false
              - column:
                  name: payment_status
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: payment_method
                  type: varchar(50)
                  constraints:
                    nullable: true
              - column:
                  name: created_user
                  type: varchar(30)
                  constraints:
                    nullable: false
              - column:
                  name: created_date
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                  name: modified_user
                  type: varchar(30)
                  constraints:
                    nullable: true
              - column:
                  name: modified_date
                  type: timestamp
                  constraints:
                    nullable: true
              - column:
                  name: version
                  type: bigint
                  constraints:
                    nullable: false

