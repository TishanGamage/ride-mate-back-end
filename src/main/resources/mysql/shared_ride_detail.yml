databaseChangeLog:
  - changeSet:
      id: 1
      author: Iruni
      changes:
        - createTable:
            tableName: shared_ride_detail
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: ride_detail_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_share_ride_detail_driver_profile
                    references: driver_ride_detail(id)
                    deleteCascade: true
              - column:
                  name: request_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: passenger_start_location_latitude
                  type: DECIMAL(10,7)
              - column:
                  name: passenger_start_location_longitude
                  type: DECIMAL(10,7)
                  constraints:
                    nullable: false
              - column:
                  name: passenger_end_location_latitude
                  type: DECIMAL(10,7)
              - column:
                  name: passenger_end_location_longitude
                  type: DECIMAL(10,7)
                  constraints:
                    nullable: false
              - column:
                  name: start_city
                  type: VARCHAR(200)
              - column:
                  name: end_city
                  type: VARCHAR(200)
              - column:
                  name: passenger_cost
                  type: decimal(25,2)
                  constraints:
                    nullable: false
              - column:
                  name: passenger_ride_distance
                  type: decimal(25,2)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: created_date
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: created_user
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: modified_date
                  type: TIMESTAMP
                  constraints:
                    nullable: true
              - column:
                  name: modified_user
                  type: VARCHAR(100)
                  constraints:
                    nullable: true
              - column:
                  name: sync_ts
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
  - changeSet:
      id: 2
      author: Dulan
      changes:
        - addColumn:
            tableName: shared_ride_detail
            columns:
              - column:
                  name: passenger_start_city
                  type: VARCHAR(100)
                  constraints:
                    nullable: true
              - column:
                  name: passenger_end_city
                  type: VARCHAR(100)
                  constraints:
                    nullable: true
