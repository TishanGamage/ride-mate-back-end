databaseChangeLog:
  - changeSet:
      id: 1
      author: TishanD
      changes:
        - createTable:
            tableName: user_profile
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    nullable: false
                    primaryKey: true
              - column:
                  name: user_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_user_profile_user
                    references: user(id)
              - column:
                  name: first_name
                  type: varchar(70)
                  constraints:
                    nullable: false
              - column:
                  name: last_name
                  type: varchar(70)
                  constraints:
                    nullable: false
              - column:
                  name: date_of_birth
                  type: timestamp
                  constraints:
                    nullable: true
              - column:
                  name: gender
                  type: varchar(30)
                  constraints:
                    nullable: true
              - column:
                  name: address
                  type: varchar(255)
                  constraints:
                    nullable: true
              - column:
                  name: city
                  type: varchar(100)
                  constraints:
                    nullable: true
              - column:
                  name: profile_picture_url
                  type: varchar(255)
                  constraints:
                    nullable: true
              - column:
                  name: created_user
                  type: varchar(30)
                  constraints:
                    nullable: false
              - column:
                  name: created_date
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                  name: modified_user
                  type: varchar(30)
                  constraints:
                    nullable: true
              - column:
                  name: modified_date
                  type: timestamp
                  constraints:
                    nullable: true
              - column:
                  name: version
                  type: bigint
                  constraints:
                    nullable: false

