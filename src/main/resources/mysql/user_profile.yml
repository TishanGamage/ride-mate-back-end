databaseChangeLog:
  - changeSet:
      id: 1
      author: Tishan
      changes:
        - createTable:
            tableName: user_profile
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    unique: true
                    foreignKeyName: fk_user_profiles_user
                    references: user(id)
              - column:
                  name: profile_image_document_id
                  type: BIGINT
                  constraints:
                    nullable: true
                    foreignKeyName: fk_user_profile_profile_image_document
                    references: document_details(id)
              - column:
                  name: date_of_birth
                  type: DATE
                  constraints:
                    nullable: true
              - column:
                  name: gender
                  type: VARCHAR(10)
                  constraints:
                    nullable: true
              - column:
                  name: bio
                  type: TEXT
                  constraints:
                    nullable: true
              - column:
                  name: address_line_1
                  type: VARCHAR(255)
                  constraints:
                    nullable: true
              - column:
                  name: address_line_2
                  type: VARCHAR(255)
                  constraints:
                    nullable: true
              - column:
                  name: address_line_3
                  type: VARCHAR(255)
                  constraints:
                    nullable: true
              - column:
                  name: address_line_4
                  type: VARCHAR(255)
                  constraints:
                    nullable: true
              - column:
                  name: city
                  type: VARCHAR(100)
                  constraints:
                    nullable: true
              - column:
                  name: state
                  type: VARCHAR(100)
                  constraints:
                    nullable: true
              - column:
                  name: postal_code
                  type: VARCHAR(20)
                  constraints:
                    nullable: true
              - column:
                  name: country
                  type: VARCHAR(100)
                  constraints:
                    nullable: true
              - column:
                  name: preferred_language
                  type: VARCHAR(10)
                  constraints:
                    nullable: true
              - column:
                  name: user_profile_completed
                  type: VARCHAR(20)
                  constraints:
                    nullable: true
              - column:
                  name: created_date
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: created_user
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: modified_date
                  type: TIMESTAMP
                  constraints:
                    nullable: true
              - column:
                  name: modified_user
                  type: VARCHAR(100)
                  constraints:
                    nullable: true
              - column:
                  name: sync_ts
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false

  - changeSet:
      id: 2
      author: Tishan
      changes:
        - addColumn:
            tableName: user_profile
            columns:
              - column:
                  name: user_verification_image_document_id
                  type: BIGINT
                  constraints:
                    nullable: true
                    foreignKeyName: fk_user_profile_verification_image_document
                    references: document_details(id)

  - changeSet:
      id: 3
      author: Tishan
      changes:
        - addColumn:
            tableName: user_profile
            columns:
              - column:
                  name: willing_to_drive
                  type: VARCHAR(3)
                  defaultValue: 'NO'
                  constraints:
                    nullable: false