spring.application.name=ride-mate-back-end
spring.liquibase.change-log=classpath:/db/changelog.yml
server.servlet.context-path=/ride-mate

# Mail configuration (shared)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Swagger/OpenAPI Configuration (shared)
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.filter=true

# Supabase Configuration (shared)
supabase.storage.bucket=RideMate

# Multipart file upload limits
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=100MB
spring.servlet.multipart.resolve-lazily=true

# JWT Configuration (shared)
jwt.access-token.expiration=900000
jwt.refresh-token.expiration=604800000

# ML Service Configuration (Shared Ride Pooling)
ml.service.base-url=http://localhost:8081
ml.service.enabled=true
ml.service.timeout=5000

# Shared Ride Pool Configuration
ride.pooling.max-search-radius=50
ride.pooling.default-search-radius=15
ride.pooling.seat-availability-threshold=1

# Redis Configuration
spring.redis.host=localhost
spring.redis.port=6379
