spring.application.name=ride-mate-back-end
spring.datasource.url=jdbc:mysql://localhost:3306/ride_mate_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=password
spring.liquibase.change-log=classpath:/db/changelog.yml
server.servlet.context-path=/ride-mate

# Mail configuration (Update with your SMTP server details)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

